# ============================================================
# Configuración de la aplicación Minimarket
# ============================================================
spring.application.name=minimarket
server.port=8080

# ============================================================
# Base de datos H2 en memoria (para desarrollo y pruebas)
# NOTA: En producción reemplazar por MySQL/PostgreSQL
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 habilitada solo para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Configuración JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# MAGIA AQUÍ: Esperar a que Hibernate cree las tablas antes de correr data.sql
spring.jpa.defer-datasource-initialization=true
# Activar logs de depuración para Spring Security
logging.level.org.springframework.security=DEBUG